# ---- LinkedIn Studio config: voice, niche, audience, creators, brand. The schedule lives in the Claude Code scheduled tasks. ----
name: "productlabs.us"                         # footer on every carousel slide (your name or handle)
person: "Dev — operator at Product Labs (Cupertino, CA) building AI automation; ships TixA, an agentic support AI"
niche: "AI automation and agentic AI for real businesses: what works, what breaks, what it costs"
