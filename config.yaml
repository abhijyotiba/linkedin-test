stories:                                        # real anecdotes the Ghostwriter may use (add yours; one line each)
  - "Managed-support consultancies lose their margin on L1 ticket volume; an AI that clears L1 turns the retainer profitable again"
  - "Home-fixture brands honouring lifetime warranties across 5–17 sales channels drown in proof-of-purchase tickets"
